server:
  port: 8084

spring:
  application:
    name: content-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${CONTENT_DB_NAME:content_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  codec:
    max-in-memory-size: 16MB
  webflux:
    multipart:
      max-in-memory-size: 1MB
      max-disk-usage-per-part: 4GB
      max-parts: 10

content:
  storage:
    local:
      base-path: ${STORAGE_PATH:/home/ahmed-yassine/Desktop/udemy-clone/backend/uploads}
      base-url: ${STORAGE_BASE_URL:http://localhost:8084}
    s3:
      bucket-name: ${S3_BUCKET_NAME:}
      region: ${AWS_REGION:us-east-1}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
