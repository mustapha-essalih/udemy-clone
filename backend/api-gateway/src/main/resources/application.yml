server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "${ALLOWED_ORIGINS:http://localhost:3000}"
                allowed-methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**, /api/auth/**

            - id: course-service
              uri: lb://course-service
              predicates:
                - Path=/api/courses/**

            - id: content-service
              uri: lb://content-service
              predicates:
                - Path=/api/content/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**, /api/enrollments/**

            - id: search-service
              uri: lb://search-service
              predicates:
                - Path=/api/search/**

            - id: admin-service
              uri: lb://admin-service
              predicates:
                - Path=/api/admin/**

jwt:
  secret: ${JWT_SECRET:dGhpc2lzYXZlcnlsb25nc2VjcmV0a2V5Zm9yandzaW50ZWdyYXRpb24=}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

logging:
  level:
    com.dev.lms.api_gateway: DEBUG
    org.springframework.cloud.gateway: INFO
